<!doctype html>
<meta charset="utf-8">
<title>review frame</title>
<style>html,body{margin:0;padding:0;background:#ddd;overflow:hidden}iframe{border:0;display:block}</style>
<iframe id="f"></iframe>
<script>
// 驗收截圖用（tools/shoot_review.py 會開這頁）：?exp=accent_a&accent=mustard&pick=1&mod=vancomycin&w=1920&h=940&demo=1&collapse=all|none|only:3&view=result&scroll=0&hd=1&blank=1&pm=1&measure=params
const q = new URLSearchParams(location.search);
const W = +(q.get('w')||innerWidth), H = +(q.get('h')||innerHeight);
const f = document.getElementById('f');
f.style.width = W+'px'; f.style.height = H+'px';
try{ localStorage.removeItem('tdm_card_collapse_v1'); }catch(e){}
f.src = "../index.html";
f.onload = ()=>{
  const w = f.contentWindow, d = w.document;
  w.confirm = ()=>true; w.alert = ()=>{};
  const step = (fn, ms)=>new Promise(r=>setTimeout(()=>{ try{ fn(); }catch(e){ console.log(e); } r(); }, ms));
  (async ()=>{
    await step(()=>{}, 300);
    const mod = q.get('mod')||'vancomycin';
    await step(()=>{ d.querySelector('.drug-switch-btn[data-drug="'+mod+'"]').click(); }, 100);
    await step(()=>{ d.querySelectorAll('.guard-modal:not(.hide) [id$="GuardDiscard"]').forEach(b=>b.click()); }, 200);
    if(q.get('exp')) await step(()=>{ const l = d.createElement('link'); l.rel = 'stylesheet'; l.href = 'tools/exp_'+q.get('exp')+'.css'; d.head.appendChild(l); }, 100);
    if(q.get('accent')) await step(()=>{ const a = q.get('accent'); if(a==='magenta') d.documentElement.removeAttribute('data-accent'); else d.documentElement.setAttribute('data-accent', a); }, 50);
    if(q.get('blank')) await step(()=>{ d.getElementById('clearAllBtn').click(); }, 200);
    else await step(()=>{ d.getElementById('loadDemoBtn').click(); }, 200);
    if(q.get('hd')) await step(()=>{ const s = d.getElementById('dialysis'); s.value='HD'; s.dispatchEvent(new w.Event('change',{bubbles:true})); }, 300);
    const c = q.get('collapse');
    const panel = d.querySelector('.drug-module.active .stack');
    const bar = panel && panel.querySelector('.sec-bar');
    if(c==='all' && bar){ await step(()=>{ const b = bar.querySelector('[data-sec-bulk]'); if(/全部收合/.test(b.textContent)) b.click(); }, 300); }
    if(c && c.startsWith('only:') && bar){ await step(()=>{ bar.querySelector('[data-sec="'+(+c.slice(5)-1)+'"]').click(); }, 300); }
    if(q.get('pick')) await step(()=>{ const r = d.querySelectorAll('.drug-module.active input.regimen-pick')[+q.get('pick')]; if(r){ r.checked = true; r.dispatchEvent(new w.Event('change',{bubbles:true})); } }, 400);
    if(q.get('view')) await step(()=>{ const b = d.querySelector('#mSwitch [data-mview="'+q.get('view')+'"]'); if(b) b.click(); }, 200);
    if(q.get('pm')) await step(()=>{ d.getElementById('hdrPmToggle').click(); }, 200);
    await step(()=>{ w.scrollTo(0, +(q.get('scroll')||0)); const rp = d.querySelector('.drug-module.active main.grid > .panel'); if(rp && q.get('rscroll')) rp.scrollTop = +q.get('rscroll'); }, 1200);
    if(q.get('measure')==='params'){
      const out = [];
      d.querySelectorAll('.drug-module.active .param-grid').forEach(g=>{
        const gr = g.getBoundingClientRect();
        const cells = Array.from(g.children).filter(c=>c.classList.contains('param-cell'));
        const rows = {};
        const info = cells.map(c=>{
          const r = c.getBoundingClientRect(), v = c.querySelector(':scope > .value'), vr = v && v.getBoundingClientRect(), lm = c.querySelector(':scope > .label .lbl-main');
          const o = {t:(lm?lm.textContent:'').trim(), r:c.dataset.r||'', left:Math.round(r.left-gr.left), right:Math.round(r.right-gr.left), top:Math.round(r.top-gr.top), vtop: vr?Math.round(vr.top-gr.top):null,
            valOverflow: v ? v.scrollWidth - v.clientWidth : 0, labCut: lm ? lm.scrollWidth - lm.clientWidth : 0, cellOverflow: c.scrollWidth - c.clientWidth};
          if(!c.classList.contains('pc-key') && o.r) (rows[o.r] = rows[o.r] || []).push(o.vtop);
          return o;
        });
        const spread = Object.entries(rows).map(([k,a])=>k+':'+(Math.max(...a)-Math.min(...a)));
        out.push({grid:g.id, w:Math.round(gr.width), scrollOver:g.scrollWidth-g.clientWidth, rowSpread:spread, cutVals:info.filter(i=>i.valOverflow>0).map(i=>i.t), cutLabels:info.filter(i=>i.labCut>0).map(i=>i.t), cellOver:info.filter(i=>i.cellOverflow>0).map(i=>i.t), info:info.map(i=>[i.t,i.r,i.left,i.right,i.top,i.vtop].join(','))});
      });
      const pre = document.createElement('pre');
      pre.style.cssText = 'position:fixed;left:0;top:0;z-index:99999;background:#000;color:#7f7;font:13px/1.35 monospace;padding:6px 10px;margin:0;white-space:pre-wrap;max-width:100%;';
      pre.textContent = out.map(g=>g.grid+' 寬'+g.w+' 溢出'+g.scrollOver+' 同列數字上緣差['+g.rowSpread.join(' ')+'] 數字被切['+g.cutVals.join(',')+'] 標籤被切['+g.cutLabels.join(',')+'] 格內溢出['+g.cellOver.join(',')+']\n  '+g.info.join('\n  ')).join('\n');
      document.body.appendChild(pre);
    }
    document.title = 'ready';
  })();
};
</script>
