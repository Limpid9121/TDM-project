<!doctype html>
<meta charset="utf-8">
<title>review frame</title>
<style>html,body{margin:0;padding:0;background:#ddd;overflow:hidden}iframe{border:0;display:block}</style>
<iframe id="f"></iframe>
<script>
// 驗收截圖用（tools/shoot_review.py 會開這頁）：?exp=accent_a&accent=mustard&pick=1&mod=vancomycin&w=1920&h=940&demo=1&collapse=all|none|only:3&view=result&scroll=0&hd=1&blank=1&click=id1,id2&worst=1|2&measure=params|contrast|cand
const q = new URLSearchParams(location.search);
const W = +(q.get('w')||innerWidth), H = +(q.get('h')||innerHeight);
const f = document.getElementById('f');
f.style.width = W+'px'; f.style.height = H+'px';
try{ localStorage.removeItem('tdm_card_collapse_v1'); }catch(e){}
f.src = "../index.html";
f.onload = ()=>{
  const w = f.contentWindow, d = w.document;
  w.confirm = ()=>true; w.alert = ()=>{};
  const step = (fn, ms)=>new Promise(r=>setTimeout(()=>{ try{ fn(); }catch(e){ console.log(e); } r(); }, ms));
  (async ()=>{
    await step(()=>{}, 300);
    const mod = q.get('mod')||'vancomycin';
    await step(()=>{ d.querySelector('.drug-switch-btn[data-drug="'+mod+'"]').click(); }, 100);
    await step(()=>{ d.querySelectorAll('.guard-modal:not(.hide) [id$="GuardDiscard"]').forEach(b=>b.click()); }, 200);
    if(q.get('exp')) await step(()=>{ const l = d.createElement('link'); l.rel = 'stylesheet'; l.href = 'tools/exp_'+q.get('exp')+'.css'; d.head.appendChild(l); }, 100);
    if(q.get('accent')) await step(()=>{ const a = q.get('accent'); if(a==='magenta') d.documentElement.removeAttribute('data-accent'); else d.documentElement.setAttribute('data-accent', a); }, 50);
    if(q.get('blank')) await step(()=>{ d.getElementById('clearAllBtn').click(); }, 200);
    else await step(()=>{ d.getElementById('loadDemoBtn').click(); }, 200);
    if(q.get('hd')) await step(()=>{ const s = d.getElementById('dialysis'); s.value='HD'; s.dispatchEvent(new w.Event('change',{bubbles:true})); }, 300);
    if(q.get('worst')){   // F6：開發用「最糟資料」開關（break-ui）。worst=1 高齡低體重＋超長文字；worst=2 極端數字（肥胖年輕、大劑量）。資料走使用者輸入的同一條路（填值＋input／change 事件）
      const LONGSITE = '左側人工膝關節周圍感染合併慢性骨髓炎及軟組織膿瘍（術後第三週，曾清創兩次）';
      const LONGORG = 'Methicillin-resistant Staphylococcus aureus（MRSA）合併 Enterococcus faecium（VRE）';
      const LONGDRUG = ['Piperacillin-tazobactam 4.5 g IV q6h','Furosemide 40 mg IV bid','Amlodipine 5 mg qd','Metformin 500 mg bid','Aspirin 100 mg qd','Atorvastatin 20 mg qhs','Pantoprazole 40 mg IV qd','Dexamethasone 5 mg IV q8h'].join('' + String.fromCharCode(10) + '');
      const LONGNOTE = '病人於外院曾使用 vancomycin 治療，期間腎功能由 SCr 0.9 惡化至 2.4 mg/dL，經調整劑量後改善；本次入院前三天開始發燒、右下肢紅腫熱痛，血液培養兩套皆長 MRSA。家屬希望盡量避免洗腎，主治醫師已會診感染科與腎臟科。';
      const mod = q.get('mod')||'vancomycin';
      const ONE = q.get('worst')==='1';
      const P = {
        vancomycin: { patientLabel:'A123456789-012345678', age:ONE?97:19, height:ONE?148:188, tbw:ONE?38.2:248, site:LONGSITE, organism:LONGORG, concomitant:LONGDRUG, otherNotes:LONGNOTE, maintDose:ONE?500:3000, maintInterval:ONE?48:6, maintInf:ONE?60:180, mic:ONE?2:0.5, targetAuc:ONE?400:600 },
        aminoglycoside: { amgPatientLabel:'A123456789-012345678', amgAge:ONE?97:19, amgHeight:ONE?148:188, amgTbw:ONE?38.2:248, amgSite:LONGSITE, amgOrganism:LONGORG, amgConcomitant:LONGDRUG, amgOtherNotes:LONGNOTE, amgMaintDose:ONE?120:900, amgMaintInterval:ONE?48:8 },
        azole: { azlPatientLabel:'A123456789-012345678', azlAge:ONE?97:19, azlHeight:ONE?148:188, azlTbw:ONE?38.2:248, azlSite:LONGSITE, azlOrganism:LONGORG, azlOtherFactors:'肝硬化 Child-Pugh C、長期使用 PPI、鼻胃管灌食', azlConcomitant:LONGDRUG, azlTreatmentGoal:LONGNOTE, azlWeightChange:'兩週內下降 8 kg（由 61 kg 降至 53 kg）', azlTroughVal:ONE?0.1:12.8, azlDoseAm:ONE?50:400, azlDosePm:ONE?50:400, azlOtherNotes:LONGNOTE },
        aed: { aedPatientLabel:'A123456789-012345678', aedAge:ONE?97:19, aedHeight:ONE?148:188, aedTbw:ONE?38.2:248, aedIndication:'難治型局部癲癇併續發全身強直陣攣發作（顱內出血術後）', aedConcomitant:LONGDRUG, aedGoal:LONGNOTE, aedLevelValue:ONE?2:98.5, aedDose:ONE?100:1500, aedOtherNotes:LONGNOTE }
      }[mod === 'vancomycin' ? 'vancomycin' : mod] || {};
      await step(()=>{
        for(const [id, v] of Object.entries(P)){ const e = d.getElementById(id); if(!e) { console.log('worst: 找不到 '+id); continue; } e.value = v; e.dispatchEvent(new w.Event('input',{bubbles:true})); e.dispatchEvent(new w.Event('change',{bubbles:true})); }
      }, 300);
      if(mod === 'vancomycin') await step(()=>{   // 清單長度也是一個值：給藥紀錄補到 33 筆、SCr 6 筆、濃度 6 筆
        const add = (btn, n, fill)=>{ for(let i=0;i<n;i++){ d.getElementById(btn).click(); const rows = d.querySelectorAll('#'+({addDoseRow:'doseTable',addScrRow:'scrTable',addLevelRow:'levelTable'})[btn]+' .entry-row'); fill(rows[rows.length-1], i); } };
        const fire = e=>{ e.dispatchEvent(new w.Event('input',{bubbles:true})); e.dispatchEvent(new w.Event('change',{bubbles:true})); };
        const pad = n=>String(n).padStart(2,'0');
        add('addDoseRow', 24, (r,i)=>{ const day = 1 + Math.floor(i/3); r.querySelector('.dose-date').value = '2026-10-'+pad(day)+'T'+pad(6+(i%3)*8)+':00'; r.querySelector('.dose-mg').value = 1250; r.querySelector('.dose-inf').value = 120; r.querySelectorAll('input').forEach(fire); });
        add('addScrRow', 5, (r,i)=>{ r.querySelector('.scr-date').value = '2026-10-'+pad(1+i); r.querySelector('.scr-val').value = (0.6+i*0.9).toFixed(2); r.querySelectorAll('input').forEach(fire); });
        add('addLevelRow', 5, (r,i)=>{ r.querySelector('.level-date').value = '2026-10-'+pad(2+i)+'T05:30'; r.querySelector('.level-val').value = (9+i*7.5).toFixed(1); r.querySelectorAll('input').forEach(fire); });
      }, 400);
    }
    const c = q.get('collapse');
    const panel = d.querySelector('.drug-module.active .stack');
    const bar = panel && panel.querySelector('.sec-bar');
    if(c==='all' && bar){ await step(()=>{ const b = bar.querySelector('[data-sec-bulk]'); if(/全部收合/.test(b.textContent)) b.click(); }, 300); }
    if(c && c.startsWith('only:') && bar){ await step(()=>{ bar.querySelector('[data-sec="'+(+c.slice(5)-1)+'"]').click(); }, 300); }
    if(q.get('pick')) await step(()=>{ const r = d.querySelectorAll('.drug-module.active input.regimen-pick')[+q.get('pick')]; if(r){ r.checked = true; r.dispatchEvent(new w.Event('change',{bubbles:true})); } }, 400);
    if(q.get('view')) await step(()=>{ const b = d.querySelector('#mSwitch [data-mview="'+q.get('view')+'"]'); if(b) b.click(); }, 200);
    if(q.get('click')) for(const id of q.get('click').split(',')) await step(()=>{ d.getElementById(id).click(); }, 250);   // 依序點這些 id（例：vancoRxMenuBtn、vancoSaveMain）
    await step(()=>{ w.scrollTo(0, +(q.get('scroll')||0)); const rp = d.querySelector('.drug-module.active main.grid > .panel'); if(rp && q.get('rscroll')) rp.scrollTop = +q.get('rscroll'); }, 1200);
    if(q.get('measure')==='params'){
      const out = [];
      d.querySelectorAll('.drug-module.active .param-grid').forEach(g=>{
        const gr = g.getBoundingClientRect();
        const cells = Array.from(g.children).filter(c=>c.classList.contains('param-cell'));
        const rows = {};
        const info = cells.map(c=>{
          const r = c.getBoundingClientRect(), v = c.querySelector(':scope > .value'), vr = v && v.getBoundingClientRect(), lm = c.querySelector(':scope > .label .lbl-main');
          const o = {t:(lm?lm.textContent:'').trim(), r:c.dataset.r||'', left:Math.round(r.left-gr.left), right:Math.round(r.right-gr.left), top:Math.round(r.top-gr.top), vtop: vr?Math.round(vr.top-gr.top):null,
            valOverflow: v ? v.scrollWidth - v.clientWidth : 0, labCut: lm ? lm.scrollWidth - lm.clientWidth : 0, cellOverflow: c.scrollWidth - c.clientWidth};
          if(!c.classList.contains('pc-key') && o.r) (rows[o.r] = rows[o.r] || []).push(o.vtop);
          return o;
        });
        const spread = Object.entries(rows).map(([k,a])=>k+':'+(Math.max(...a)-Math.min(...a)));
        out.push({grid:g.id, w:Math.round(gr.width), scrollOver:g.scrollWidth-g.clientWidth, rowSpread:spread, cutVals:info.filter(i=>i.valOverflow>0).map(i=>i.t), cutLabels:info.filter(i=>i.labCut>0).map(i=>i.t), cellOver:info.filter(i=>i.cellOverflow>0).map(i=>i.t), info:info.map(i=>[i.t,i.r,i.left,i.right,i.top,i.vtop].join(','))});
      });
      const pre = document.createElement('pre');
      pre.style.cssText = 'position:fixed;left:0;top:0;z-index:99999;background:#000;color:#7f7;font:13px/1.35 monospace;padding:6px 10px;margin:0;white-space:pre-wrap;max-width:100%;';
      pre.textContent = out.map(g=>g.grid+' 寬'+g.w+' 溢出'+g.scrollOver+' 同列數字上緣差['+g.rowSpread.join(' ')+'] 數字被切['+g.cutVals.join(',')+'] 標籤被切['+g.cutLabels.join(',')+'] 格內溢出['+g.cellOver.join(',')+']\n  '+g.info.join('\n  ')).join('\n');
      document.body.appendChild(pre);
    }
    if(q.get('forcebad')) await step(()=>{ const st = d.createElement('style'); st.textContent = '.panel > .param-grid .param-cell .sub{color:#1C7A43 !important}'; d.head.appendChild(st); }, 50);   // 量測器自我檢查：故意弄一個低對比，應被抓到
    if(q.get('measure')==='rowalign'){   // F6：左欄每個 .field-row 裡，各欄標籤上緣／輸入框上緣是否對齊（差 >2 px 列出）
      const out = [];
      d.querySelectorAll('.drug-module.active .field-row').forEach((row,i)=>{
        if(!row.offsetParent) return;
        const fs = Array.from(row.querySelectorAll(':scope > .field')).filter(f=>f.offsetParent);
        if(fs.length < 2) return;
        const info = fs.map(f=>{ const l = f.querySelector(':scope > label, :scope > .label'); const c = f.querySelector('input:not([type=checkbox]):not([type=radio]):not(.dt24-src), select, textarea'); return {t:(l?l.textContent.trim().slice(0,14):'?'), lt:l?Math.round(l.getBoundingClientRect().top):null, ct:c?Math.round(c.getBoundingClientRect().top):null, cb:c?Math.round(c.getBoundingClientRect().bottom):null}; });
        const lts = info.map(x=>x.lt).filter(x=>x!==null), cts = info.map(x=>x.ct).filter(x=>x!==null);
        const dl = Math.max(...lts)-Math.min(...lts), dc = Math.max(...cts)-Math.min(...cts);
        if(dl>2 || dc>2) out.push('列'+i+' 標籤差'+dl+' 輸入差'+dc+'  '+info.map(x=>x.t+'['+x.lt+'/'+x.ct+']').join(' | '));
      });
      const pre = document.createElement('pre');
      pre.style.cssText = 'position:fixed;left:0;top:0;z-index:99999;background:#000;color:#7f7;font:12px/1.3 monospace;padding:6px 10px;margin:0;white-space:pre-wrap;max-width:100%;';
      pre.textContent = '未對齊的欄位列 '+out.length+' 個'+String.fromCharCode(10)+out.join(String.fromCharCode(10));
      document.body.appendChild(pre);
      document.title = 'ROWALIGN:' + out.join(' // ');
    }
    if(q.get('measure')==='cand'){
      const out = [];
      d.querySelectorAll('.drug-module.active table.regimen-table[data-rg="cand"]').forEach(t=>{
        const tr0 = t.getBoundingClientRect(), wrap = t.closest('.table-scroll'), wr = wrap.getBoundingClientRect(), sec = t.closest('.section-block').getBoundingClientRect();
        out.push(t.id+' 表寬'+Math.round(tr0.width)+' 容器'+Math.round(wr.width)+' 區塊'+Math.round(sec.width)+' 區塊左'+Math.round(sec.left)+' 捲動溢出'+(wrap.scrollWidth-wrap.clientWidth));
        { const c1 = w.getComputedStyle(t), tb = t.querySelector('tbody'), c2 = w.getComputedStyle(tb), r0 = t.querySelector('tbody tr'), c3 = w.getComputedStyle(r0); out.push('  table display='+c1.display+' width='+c1.width+' | tbody display='+c2.display+' width='+c2.width+' | tr display='+c3.display+' width='+c3.width+' cols='+c3.gridTemplateColumns+' | wrap w='+wrap.clientWidth+' disp='+w.getComputedStyle(wrap).display+' parent='+wrap.parentElement.clientWidth+' pdisp='+w.getComputedStyle(wrap.parentElement).display+' minw='+c1.minWidth+' maxw='+c1.maxWidth+' boxs='+c1.boxSizing+' pad='+c1.paddingLeft); }
        t.querySelectorAll('tr').forEach(r=>{
          const cs = Array.from(r.children).filter(c=>w.getComputedStyle(c).display!=='none');
          out.push('  '+r.parentElement.tagName+' '+cs.map(c=>{ const b = c.getBoundingClientRect(); const flag = (c.scrollWidth-c.clientWidth>1) ? '!' : ''; return Math.round(b.left-tr0.left)+'-'+Math.round(b.right-tr0.left)+flag; }).join(' '));
        });
      });
      const pre = document.createElement('pre');
      pre.style.cssText = 'position:fixed;left:0;top:0;z-index:99999;background:#000;color:#7f7;font:12px/1.3 monospace;padding:6px 10px;margin:0;white-space:pre-wrap;max-width:100%;';
      pre.textContent = out.join('\n');
      document.body.appendChild(pre);
    }
    if(q.get('measure')==='contrast'){
      const parse = c=>{ const m = c.match(/rgba?\(([^)]+)\)/); if(!m) return [0,0,0,1]; const a = m[1].split(',').map(x=>parseFloat(x)); return [a[0],a[1],a[2],a.length>3?a[3]:1]; };
      const blend = (f,b)=>[0,1,2].map(i=>f[i]*f[3]+b[i]*(1-f[3])).concat([1]);
      const L = c=>{ const v = c.slice(0,3).map(x=>{ x/=255; return x<=0.03928?x/12.92:Math.pow((x+0.055)/1.055,2.4); }); return 0.2126*v[0]+0.7152*v[1]+0.0722*v[2]; };
      const bgOf = el=>{ const chain = []; for(let e = el; e && e.nodeType===1; e = e.parentElement){ chain.push(parse(w.getComputedStyle(e).backgroundColor)); } let bg = [255,255,255,1]; for(let i = chain.length-1; i>=0; i--){ if(chain[i][3]>0) bg = chain[i][3]>=1 ? chain[i] : blend(chain[i], bg); } return bg; };
      const bad = [];
      const roots = d.querySelectorAll('.drug-module.active .panel:not(#inputPanel) > .results-head, .drug-module.active .panel > .param-grid, header.top, .drug-module.active .regimen-table, .drug-module.active .regimen-pick-bar.active, .drug-module.active .mod-tabs');
      roots.forEach(root=>{
        const walker = d.createTreeWalker(root, NodeFilter.SHOW_TEXT);
        let n; const seen = new Set();
        while((n = walker.nextNode())){
          const el = n.parentElement; if(!n.textContent.trim() || seen.has(el)) continue; seen.add(el);
          const cs = w.getComputedStyle(el); if(cs.display==='none' || cs.visibility==='hidden') continue;
          const r = el.getBoundingClientRect(); if(!r.width || !r.height) continue;
          const fg = blend(parse(cs.color), bgOf(el)), bg = bgOf(el);
          const ratio = (Math.max(L(fg),L(bg))+0.05)/(Math.min(L(fg),L(bg))+0.05);
          const px = parseFloat(cs.fontSize), bold = parseInt(cs.fontWeight)>=700;
          const need = (px>=24 || (px>=18.66 && bold)) ? 3 : 4.5;
          if(ratio < need) bad.push(ratio.toFixed(2)+' '+(el.className||el.tagName)+' "'+n.textContent.trim().slice(0,18)+'" '+cs.color+' on rgb('+bg.slice(0,3).map(Math.round)+')');
        }
      });
      const pre = document.createElement('pre');
      pre.style.cssText = 'position:fixed;left:0;top:0;z-index:99999;background:#000;color:#7f7;font:13px/1.35 monospace;padding:6px 10px;margin:0;white-space:pre-wrap;max-width:100%;';
      pre.textContent = '對比不足 '+bad.length+' 項（<4.5:1，大字 <3:1）\n'+bad.slice(0,30).join('\n');
      document.body.appendChild(pre);
    }
    document.title = 'ready';
  })();
};
</script>
